<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asignaciones Teocráticas</title>
<meta name="theme-color" content="#18181b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f4f5; --bg2:#e9e9eb; --card:#fff;
  --text:#18181b; --muted:#71717a; --line:#e4e4e7;
  --accent:#18181b; --accent-fg:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}

#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:1000;transition:opacity .35s}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:2.5px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--muted);font-size:13px;letter-spacing:.02em}

.view{min-height:100vh;display:none;padding:24px 20px 100px;max-width:480px;margin:0 auto;animation:fadeUp .35s}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:28px}
.label{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;display:block}
.field{margin-bottom:16px}

input,select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);font-family:inherit;font-size:15px;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(24,24,27,.06)}

button{font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn{width:100%;padding:13px;background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:15px;font-weight:500}
.btn:hover{background:#2f2f33}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--bg2)}
.btn-sm{padding:9px 14px;font-size:14px;width:auto}

.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card-title{font-weight:600;font-size:15px;margin-bottom:6px}
.card-meta{color:var(--muted);font-size:13px}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}

.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.badge-warn{background:#fffbeb;color:#b45309}
.badge-danger{background:#fef2f2;color:#b91c1c}
.badge-info{background:#eff6ff;color:#1d4ed8}
.badge-neutral{background:var(--bg2);color:var(--muted)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.menu-btn{background:transparent;border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:8px;text-align:center;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);background:transparent;cursor:pointer}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.04)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.5}

#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:calc(100% - 40px);max-width:420px;pointer-events:none}
.toast{background:var(--text);color:var(--accent-fg);padding:14px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:toastIn .3s;pointer-events:auto}
.toast.success{background:#047857}
.toast.error{background:#b91c1c}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}

.fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--text);color:var(--accent-fg);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:100}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:500}
.modal-bg.active{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px 20px 32px;animation:slideUp .3s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted)}

.link-tabs{display:flex;justify-content:center;gap:20px;margin-top:24px;font-size:14px}
.link-tabs a{color:var(--muted);text-decoration:none;cursor:pointer}
.link-tabs a.active{color:var(--text);font-weight:500}

.asg-date{width:48px;flex-shrink:0;text-align:center}
.asg-date-day{font-size:20px;font-weight:600;line-height:1}
.asg-date-month{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>Cargando…</p></div>
<div id="toast-container"></div>

<!-- LOGIN -->
<div class="view" id="view-login">
  <div style="padding-top:60px">
    <h1>Asignaciones</h1>
    <p class="subtitle">Inicia sesión para ver tus asignaciones</p>
    <form id="form-login">
      <div class="field"><label class="label">Correo</label><input type="email" id="login-email" required placeholder="tu@correo.com"></div>
      <div class="field"><label class="label">Contraseña</label><input type="password" id="login-pass" required placeholder="••••••••"></div>
      <button type="submit" class="btn" id="btn-login">Entrar</button>
    </form>
    <div class="link-tabs">
      <a class="active" onclick="switchAuth('login')">Iniciar sesión</a>
      <a onclick="switchAuth('signup')">Crear cuenta</a>
    </div>
  </div>
</div>

<!-- SIGNUP -->
<div class="view" id="view-signup">
  <div style="padding-top:40px">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate para recibir tus asignaciones</p>
    <form id="form-signup">
      <div class="field"><label class="label">Nombre completo</label><input type="text" id="su-name" required placeholder="Juan Pérez"></div>
      <div class="field"><label class="label">Correo</label><input type="email" id="su-email" required placeholder="tu@correo.com"></div>
      <div class="field"><label class="label">Teléfono (opcional)</label><input type="tel" id="su-phone" placeholder="+591 70000000"></div>
      <div class="field"><label class="label">Contraseña</label><input type="password" id="su-pass" required minlength="6" placeholder="Mínimo 6 caracteres"></div>
      <button type="submit" class="btn" id="btn-signup">Crear cuenta</button>
    </form>
    <div class="link-tabs">
      <a onclick="switchAuth('login')">Iniciar sesión</a>
      <a class="active" onclick="switchAuth('signup')">Crear cuenta</a>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="view" id="view-dashboard">
  <div class="topbar">
    <div>
      <h1 style="font-size:20px;margin:0" id="user-name">—</h1>
      <p style="color:var(--muted);font-size:13px" id="user-role">—</p>
    </div>
    <button class="menu-btn" onclick="logout()">Salir</button>
  </div>
  <div id="admin-section" style="display:none;margin-bottom:20px">
    <button class="btn btn-ghost" onclick="showView('view-admin')">⚙️ Panel de administrador</button>
  </div>
  <h2 style="margin-bottom:12px">Mis asignaciones</h2>
  <div id="asg-list"></div>
</div>

<!-- ADMIN -->
<div class="view" id="view-admin">
  <div class="topbar">
    <div>
      <h1 style="font-size:20px;margin:0">Panel admin</h1>
      <p style="color:var(--muted);font-size:13px">Gestión de asignaciones</p>
    </div>
    <button class="menu-btn" onclick="showView('view-dashboard')">Volver</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchAdminTab('asg')">Asignaciones</div>
    <div class="tab" onclick="switchAdminTab('people')">Personas</div>
  </div>
  <div id="admin-tab-asg"><div id="admin-asg-list"></div></div>
  <div id="admin-tab-people" style="display:none"><div id="admin-people-list"></div></div>
  <button class="fab" onclick="openNewAssignment()">+</button>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-asg">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-asg-title">Nueva asignación</h2>
      <button class="close-btn" onclick="closeModal('modal-asg')">×</button>
    </div>
    <form id="form-asg">
      <input type="hidden" id="asg-id">
      <div class="field"><label class="label">Persona</label><select id="asg-person" required></select></div>
      <div class="field"><label class="label">Título</label><input type="text" id="asg-title" required placeholder="Lectura de la Biblia"></div>
      <div class="field"><label class="label">Tipo</label>
        <select id="asg-type">
          <option value="vida_ministerio">Vida y Ministerio</option>
          <option value="fin_semana">Fin de semana</option>
          <option value="asamblea">Asamblea</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div style="display:flex;gap:12px">
        <div class="field" style="flex:1"><label class="label">Fecha</label><input type="date" id="asg-date" required></div>
        <div class="field" style="flex:1"><label class="label">Hora</label><input type="time" id="asg-time"></div>
      </div>
      <div class="field"><label class="label">Sala</label><input type="text" id="asg-room" value="Salón A"></div>
      <div class="field"><label class="label">Notas</label><textarea id="asg-notes" rows="2"></textarea></div>
      <button type="submit" class="btn" id="btn-save-asg">Guardar</button>
    </form>
  </div>
</div>

<script>
// ============================================================
const SUPABASE_URL='https://glgostqeocepewpsqsbm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsZ29zdHFlb2NlcGV3cHNxc2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNjUwODQsImV4cCI6MjExMDg0MTA4NH0.pbBk4KZV3TBnU4WXoXFOWD-P4AsZZeGMG_5oXcbS3Z4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

let me=null, profilesCache=[];

// UI
const $=id=>document.getElementById(id);
const showView=id=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);};
const showLoader=()=>$('loader').classList.remove('hidden');
const hideLoader=()=>$('loader').classList.add('hidden');
const openModal=id=>$(id).classList.add('active');
const closeModal=id=>$(id).classList.remove('active');

function toast(msg,type=''){
  const el=document.createElement('div');
  el.className='toast '+type; el.textContent=msg;
  $('toast-container').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function roleLabel(r){return({admin:'Administrador',anciano:'Anciano',siervo_ministerial:'Siervo ministerial',publicador:'Publicador'})[r]||r;}
function switchAuth(w){showView(w==='login'?'view-login':'view-signup');}

// AUTH
$('form-login').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('btn-login'); b.disabled=true; b.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({
    email:$('login-email').value.trim(), password:$('login-pass').value
  });
  b.disabled=false; b.textContent='Entrar';
  if(error) return toast(error.message,'error');
  await bootUser();
});

$('form-signup').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('btn-signup'); b.disabled=true; b.textContent='Creando…';
  const {data,error}=await sb.auth.signUp({
    email:$('su-email').value.trim(),
    password:$('su-pass').value,
    options:{data:{full_name:$('su-name').value.trim(),phone:$('su-phone').value.trim()}}
  });
  b.disabled=false; b.textContent='Crear cuenta';
  if(error) return toast(error.message,'error');
  if(!data.session){toast('Cuenta creada. Revisa tu correo.','success');switchAuth('login');return;}
  toast('¡Bienvenido!','success');
  await bootUser();
});

async function logout(){
  await sb.auth.signOut();
  me=null; showView('view-login'); $('form-login').reset();
}

// BOOT
async function bootUser(){
  showLoader();
  const {data:{user}}=await sb.auth.getUser();
  if(!user){hideLoader();showView('view-login');return;}
  me={id:user.id,email:user.email};

  let {data:profile}=await sb.from('people').select('*').eq('id',user.id).maybeSingle();
  if(!profile){
    await sb.from('people').insert({
      id:user.id,
      full_name:user.user_metadata.full_name||user.email,
      email:user.email,
      phone:user.user_metadata.phone||null
    });
    ({data:profile}=await sb.from('people').select('*').eq('id',user.id).single());
  }
  me.profile=profile;

  await loadDashboard();
  initRealtime();
  hideLoader();
  showView('view-dashboard');

  if('Notification' in window && Notification.permission==='default'){
    setTimeout(()=>Notification.requestPermission(),1500);
  }
}

async function loadDashboard(){
  $('user-name').textContent=me.profile.full_name;
  $('user-role').textContent=roleLabel(me.profile.role);
  $('admin-section').style.display=me.profile.role==='admin'?'block':'none';

  const {data:asgs,error}=await sb.from('v_upcoming_assignments').select('*').eq('person_id',me.id);
  const list=$('asg-list');
  if(error){list.innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}
  if(!asgs||!asgs.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No tienes asignaciones próximas</p></div>';
    return;
  }
  list.innerHTML=asgs.map(renderAsgCard).join('');
}

function renderAsgCard(a){
  const d=new Date(a.meeting_date+'T00:00:00');
  const day=d.getDate();
  const month=d.toLocaleString('es',{month:'short'});
  const dl=a.days_left;
  let bc='badge-info', bt='';
  if(dl<0){bc='badge-neutral';bt='Pasada';}
  else if(dl===0){bc='badge-danger';bt='HOY';}
  else if(dl===1){bc='badge-danger';bt='Mañana';}
  else if(dl<=7){bc='badge-warn';bt='En '+dl+' días';}
  else{bc='badge-info';bt='En '+dl+' días';}

  return `<div class="card">
    <div class="card-row">
      <div style="display:flex;gap:14px;align-items:center">
        <div class="asg-date">
          <div class="asg-date-day">${day}</div>
          <div class="asg-date-month">${month}</div>
        </div>
        <div>
          <div class="card-title">${esc(a.title)}</div>
          <div class="card-meta">${esc(a.room||'')}${a.meeting_time?' · '+a.meeting_time.slice(0,5):''}</div>
        </div>
      </div>
      <span class="badge ${bc}">${bt}</span>
    </div>
  </div>`;
}

// ADMIN
function switchAdminTab(t){
  document.querySelectorAll('#view-admin .tab').forEach((el,i)=>{
    el.classList.toggle('active',(t==='asg'&&i===0)||(t==='people'&&i===1));
  });
  $('admin-tab-asg').style.display=t==='asg'?'block':'none';
  $('admin-tab-people').style.display=t==='people'?'block':'none';
  t==='asg'?loadAdminAsgs():loadAdminPeople();
}

async function loadAdminPeople(){
  const {data,error}=await sb.from('people').select('*').order('full_name');
  if(error) return toast(error.message,'error');
  profilesCache=data||[];
  $('admin-people-list').innerHTML=profilesCache.map(p=>`
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${esc(p.full_name)}</div>
          <div class="card-meta">${esc(p.email||'')}</div>
        </div>
        <span class="badge badge-neutral">${roleLabel(p.role)}</span>
      </div>
    </div>`).join('');
}

async function loadAdminAsgs(){
  const {data,error}=await sb.from('v_upcoming_assignments').select('*').order('meeting_date');
  if(error) return toast(error.message,'error');
  const el=$('admin-asg-list');
  if(!data.length){el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Sin asignaciones</p></div>';return;}
  el.innerHTML=data.map(a=>`
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${esc(a.title)}</div>
          <div class="card-meta">${esc(a.full_name)} · ${a.meeting_date}${a.meeting_time?' '+a.meeting_time.slice(0,5):''}</div>
        </div>
        <button class="btn btn-ghost btn-sm" data-id="${a.id}">Editar</button>
      </div>
    </div>`).join('');

  el.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.onclick=()=>{
      const a=data.find(x=>x.id===btn.dataset.id);
      if(a) editAsg(a);
    };
  });
}

async function ensurePeopleLoaded(){
  if(profilesCache.length) return;
  const {data}=await sb.from('people').select('*').eq('is_active',true).order('full_name');
  profilesCache=data||[];
}

async function openNewAssignment(){
  await ensurePeopleLoaded();
  $('modal-asg-title').textContent='Nueva asignación';
  $('form-asg').reset();
  $('asg-id').value='';
  $('asg-room').value='Salón A';
  $('asg-person').innerHTML='<option value="">Selecciona…</option>'+
    profilesCache.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('');
  openModal('modal-asg');
}

async function editAsg(a){
  await ensurePeopleLoaded();
  $('modal-asg-title').textContent='Editar asignación';
  $('asg-id').value=a.id;
  $('asg-title').value=a.title;
  $('asg-type').value=a.meeting_type;
  $('asg-date').value=a.meeting_date;
  $('asg-time').value=a.meeting_time||'';
  $('asg-room').value=a.room||'';
  $('asg-person').innerHTML='<option value="">Selecciona…</option>'+
    profilesCache.map(p=>`<option value="${p.id}" ${p.id===a.person_id?'selected':''}>${esc(p.full_name)}</option>`).join('');
  openModal('modal-asg');
}

$('form-asg').addEventListener('submit',async e=>{
  e.preventDefault();
  const id=$('asg-id').value;
  const payload={
    person_id:$('asg-person').value,
    title:$('asg-title').value.trim(),
    meeting_type:$('asg-type').value,
    meeting_date:$('asg-date').value,
    meeting_time:$('asg-time').value||null,
    room:$('asg-room').value.trim()||null,
    notes:$('asg-notes').value.trim()||null,
    created_by:me.id
  };
  const b=$('btn-save-asg'); b.disabled=true; b.textContent='Guardando…';
  let error;
  if(id) ({error}=await sb.from('assignments').update(payload).eq('id',id));
  else ({error}=await sb.from('assignments').insert(payload));
  b.disabled=false; b.textContent='Guardar';
  if(error) return toast(error.message,'error');
  toast('Guardado','success');
  closeModal('modal-asg');
  loadAdminAsgs();
});

// REALTIME
function initRealtime(){
  sb.channel('asg-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'assignments'},payload=>{
      if(me?.profile?.role==='admin' && $('view-admin').classList.contains('active')) loadAdminAsgs();
      if(payload.new && payload.new.person_id===me?.id){
        const t=payload.eventType==='INSERT'?'Nueva asignación':
                payload.eventType==='UPDATE'?'Asignación actualizada':'Asignación';
        toast(`${t}: ${payload.new.title}`,'success');
        if(Notification.permission==='granted'){
          new Notification(t,{body:payload.new.title});
        }
        loadDashboard();
      }
    })
    .subscribe();
}

// INIT
sb.auth.onAuthStateChange(async event=>{
  if(event==='SIGNED_IN'&&!me) await bootUser();
  if(event==='SIGNED_OUT'){me=null;showView('view-login');}
});

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){ await bootUser(); }
  else{ hideLoader(); showView('view-login'); }
})();
</script>
</body>
</html>
